<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área ADM</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body{
background:#000;
color:#fff;
font-family:Arial;
display:flex;
justify-content:center;
padding:10px;
margin:0;
}

.card{
width:100%;
max-width:650px;
background:#0b0b0b;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px red;
}

button{
width:100%;
padding:14px;
margin-top:10px;
background:red;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
font-weight: bold;
}

input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  box-sizing: border-box;
}

.tag-colou {
    color: red;
    font-size: 12px;
    font-weight: bold;
    background: #ffe6e6;
    padding: 3px 6px;
    border-radius: 4px;
    margin-left: 10px;
}

.aluno-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid #222;
}

.aluno-info {
    font-size: 16px;
}

.btn-apagar {
    width: auto;
    padding: 6px 12px;
    margin: 0;
    background: darkred;
    font-size: 13px;
    border-radius: 5px;
}
.btn-apagar:hover {
    background: red;
}
</style>
</head>

<body>

<div class="card">

<h2>Área Administrativa</h2>

<!-- TELA DE LOGIN (ANTES DE ENTRAR) -->
<div id="tela-login">
  <input id="senha" placeholder="Digite a Senha" type="password">
  <button id="btnEntrar">Entrar</button>
  <button onclick="voltar()" style="background: #333; margin-top: 10px;">← Voltar ao Simulado</button>
</div>

<!-- PAINEL ADM (DEPOIS DE LOGAR) -->
<div id="painel" style="display:none">
  <h3>Ranking (Tempo Real)</h3>
  <div id="rank"></div>

  <button onclick="limpar()" style="background: #333; margin-top: 20px;">🗑️ Limpar Todo o Ranking</button>
  <button onclick="voltar()" style="background: #555; margin-top: 10px;">← Sair / Voltar ao Simulado</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDpyHKHjNhVGP_T-azFM8VE99mMzoQ2TKw",
  authDomain: "simulado1.firebaseapp.com",
  databaseURL: "https://simulado1-default-rtdb.firebaseio.com",
  projectId: "simulado1",
  storageBucket: "simulado1.firebasestorage.app",
  messagingSenderId: "625344929823",
  appId: "1:625344929823:web:2a64283815450a7af7b52a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
document.getElementById("btnEntrar").addEventListener("click", login);

function login(){
  let s = document.getElementById("senha").value;

  if(s !== "2821"){
    alert("Senha incorreta!");
    return;
  }

  document.getElementById("tela-login").style.display = "none";
  document.getElementById("painel").style.display = "block";

  mostrar();
}

function mostrar(){
  db.ref("ranking").off(); 

  db.ref("ranking").on("value",(snapshot)=>{
    let dados = snapshot.val() || {};
    
    let lista = Object.keys(dados).map(key => {
        return {
            id: key, 
            ...dados[key] 
        };
    });

    lista.sort((a,b) => b.pontos - a.pontos);

    if (lista.length === 0) {
        document.getElementById("rank").innerHTML = "<p style='color: gray;'>Nenhum aluno no ranking ainda.</p>";
        return;
    }

    document.getElementById("rank").innerHTML =
      lista.map((x, i) => {
          let tagCola = x.colou ? `<span class="tag-colou">🚨 Colou</span>` : '';
          
          return `
          <div class="aluno-item">
              <div class="aluno-info">
                  <strong>${i+1}º</strong> ${x.nome} - ${x.pontos} acertos ${tagCola}
              </div>
              <button class="btn-apagar" onclick="apagarAluno('${x.id}', '${x.nome}')">Excluir</button>
          </div>
          `;
      }).join("");
  });
}

function apagarAluno(id, nome){
  if(confirm(`Tem certeza que deseja apagar o resultado de ${nome}?`)) {
      db.ref("ranking/" + id).remove();
  }
}

function limpar(){
  if(confirm("🚨 ATENÇÃO: Tem certeza que deseja limpar TODO o ranking? Isso não pode ser desfeito!")) {
      db.ref("ranking").remove();
  }
}

function voltar(){
  window.location.href = "index.html";
}
</script>

</body>
</html>

```
