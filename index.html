<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTS3M4l4QJL02_5uMXI1BqD_6qP61Uq8wNTug&s" rel="icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;}
body{
background:#000;
color:#fff;
font-family:Arial;
display:flex;
justify-content:center;
padding:10px;
margin:0;
}
.card{
width:100%;
max-width:950px;
background:#0b0b0b;
padding:15px;
border-radius:15px;
box-shadow:0 0 15px red;
}
h2{font-size:20px;}
button{
width:100%;
padding:14px;
margin-top:15px;
background:red;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
input{
width:100%;
max-width:100%;
padding:14px;
border-radius:10px;
margin-top:10px;
font-size:16px;
border:none;
outline:none;
background:#111;
color:#fff;
}
.opcao{
padding:14px;
margin-top:10px;
background:#111;
border:1px solid #222;
border-radius:10px;
cursor:pointer;
}
.certa{background:green !important;}
.errada{background:darkred !important;}
#quiz,#final{display:none;}
#progresso{
margin-bottom:10px;
color:#ff4d4d;
font-weight:bold;
}
#exp {
margin-top:15px;
background:#1a1a1a;
padding:10px;
border-radius:8px;
border-left:4px solid red;
white-space: pre-line;
}
</style>
</head>

<body>

<div class="card">

<div id="inicio">
<h2>Simulado Matemática</h2>
<input id="nome" placeholder="Seu nome">
<button onclick="iniciar()">Iniciar Prova</button>
<button onclick="window.location.href='adm.html'">Área ADM</button>
</div>

<div id="quiz">
<div id="progresso"></div>
<div id="p"></div> 
<div id="op"></div>
<p id="exp"></p>
<button onclick="prox()">Próxima</button>
<button id="btnVoltar" onclick="voltar()">Voltar</button>
</div>

<div id="final">
<h2>Resultado Final</h2>
<p id="res"></p>
<h3>Ranking Geral</h3>
<div id="ranking"></div>
<button onclick="reiniciar()">Reiniciar Prova</button>
<button onclick="gerarPDF()">Baixar PDF</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDpyHKHjNhVGP_T-azFM8VE99mMzoQ2TKw",
  authDomain: "simulado1.firebaseapp.com",
  databaseURL: "https://simulado1-default-rtdb.firebaseio.com",
  projectId: "simulado1",
  storageBucket: "simulado1.firebasestorage.app",
  messagingSenderId: "625344929823",
  appId: "1:625344929823:web:2a64283815450a7af7b52a"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let nome="", i=0, pontos=0, respostas=[], respondido=false;

// Coloque todas as suas outras questões aqui seguindo este padrão de objeto
const banco = [
  {
    t: "Resolva a equação exponencial: 2^x = 8",
    o: ["2", "3", "4", "1"],
    c: 1, 
    x: "Para resolver, transformamos 8 em potência de base 2.\n\nSabemos que 8 = 2³.\n\nEntão igualamos os expoentes: x = 3.",
    imagem: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=500"
  },
  {
    t: "Qual é a principal characteristic da função exponencial?",
    o: ["Cresce ou decresce rapidamente", "É sempre constante", "Forma uma reta", "Não varia"],
    c: 0,
    x: "A função exponencial cresce ou decresce rapidamente.\n\nIsso acontece porque o número está no expoente.",
    imagem: "https://images.unsplash.com/photo-1509228468518-180dd4864904?w=500"
  }
];

function iniciar(){
  nome = document.getElementById("nome").value;
  if(!nome) return alert("Digite seu nome");

  document.getElementById("inicio").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  carregar();
}

function carregar(){
  if(i >= banco.length) return fim();

  let q = banco[i];
  respondido = false;

  // Atualiza cabeçalho do progresso
  document.getElementById("progresso").innerText = `Questão ${i+1} de ${banco.length}`;

  // Renderiza enunciado numerado + Imagem integrada no contêiner correto (#p)
  let containerPergunta = document.getElementById("p");
  containerPergunta.innerHTML = `<p><strong>Questão ${i+1}:</strong> ${q.t}</p>`;

  if(q.imagem){
    containerPergunta.innerHTML += `<img src="${q.imagem}" alt="Imagem da questão" style="display:block; max-width:100%; max-height:280px; margin:15px auto; border-radius:6px; border:1px solid #333;">`;
  }

  // Renderiza alternativas
  let html = "";
  q.o.forEach((o, idx) => {
    html += `<div class="opcao" data-idx="${idx}" onclick="responder(${idx})">${o}</div>`;
  });
  document.getElementById("op").innerHTML = html;
  document.getElementById("exp").innerText = "";

  // Verifica se o aluno já voltou e respondeu essa antes
  let respAnterior = respostas[i];
  if(respAnterior){
    respondido = true;
    let ops = document.querySelectorAll(".opcao");
    ops[respAnterior.c].classList.add("certa");
    if(respAnterior.r !== respAnterior.c){
      ops[respAnterior.r].classList.add("errada");
    }
    document.getElementById("exp").innerText = respAnterior.x;
  }
}

function responder(e){
  if(respondido) return;
  respondido = true;

  let q = banco[i];
  let ops = document.querySelectorAll(".opcao");

  ops[q.c].classList.add("certa");
  if(e !== q.c) {
    ops[e].classList.add("errada");
  } else {
    pontos++;
  }

  respostas[i] = {q: q.t, r: e, c: q.c, x: q.x, o: q.o};
  document.getElementById("exp").innerText = q.x;
}

function prox(){
  if(!respondido && i < banco.length) {
    return alert("Por favor, responda a questão antes de avançar.");
  }
  i++;
  carregar();
}

function voltar(){
  if(i <= 0) return;
  i--;
  carregar();
}

function fim(){
  document.getElementById("quiz").style.display = "none";
  document.getElementById("final").style.display = "block";

  salvarRanking();
  mostrarRanking();

  document.getElementById("res").innerText = `${nome} acertou ${pontos}/${banco.length}`;
}

function salvarRanking(){
  db.ref("ranking").push({
    nome: nome,
    pontos: pontos,
    data: Date.now()
  });
}

function mostrarRanking(){
  db.ref("ranking").off(); 
  db.ref("ranking").orderByChild("pontos").limitToLast(10).on("value", (snapshot) => {
    let dados = snapshot.val() || {};
    let lista = Object.values(dados);
    
    lista.sort((a,b) => b.pontos - a.pontos);

    document.getElementById("ranking").innerHTML =
      lista.map((x, idx) => `${idx+1}º - ${x.nome} (${x.pontos} acertos)`).join("<br>");
  });
}

function reiniciar(){
  i = 0;
  pontos = 0;
  respostas = [];
  respondido = false;

  document.getElementById("final").style.display = "none";
  document.getElementById("quiz").style.display = "none";
  document.getElementById("inicio").style.display = "block";
  document.getElementById("nome").value = "";
}

function gerarPDF(){
  const {jsPDF} = window.jspdf;
  let doc = new jsPDF();

  let y = 10;
  doc.text(`Aluno: ${nome}`, 10, y);
  y += 10;

  respostas.forEach((r, idx) => {
    let texto = `${idx+1}) ${r.q}\nSua Resposta: ${r.o[r.r]}\nResposta Correta: ${r.o[r.c]}\nExplicação: ${r.x}`;
    let linhas = doc.splitTextToSize(texto, 180);

    if(y + linhas.length * 7 > 280){
      doc.addPage();
      y = 10;
    }

    doc.text(linhas, 10, y);
    y += linhas.length * 7 + 5;
  });

  doc.save("resultado.pdf");
}

mostrarRanking();
</script>

</body>
</html>
