<html lang="pt-BR">

<style>
*{box-sizing:border-box;}
body{
background:#000;
color:#fff;
font-family:Arial;
display:flex;
justify-content:center;
padding:10px;
margin:0;
}
.card{
width:100%;
max-width:950px;
background:#0b0b0b;
padding:15px;
border-radius:15px;
box-shadow:0 0 15px red;
}
h2{font-size:20px;}
button{
width:100%;
padding:14px;
margin-top:15px;
background:red;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
input{
width:100%;
max-width:100%;
padding:14px;
border-radius:10px;
margin-top:10px;
font-size:16px;
border:none;
outline:none;
background:#111;
color:#fff;
}
.opcao{
padding:14px;
margin-top:10px;
background:#111;
border:1px solid #222;
border-radius:10px;
cursor:pointer;
}
.certa{background:green !important;}
.errada{background:darkred !important;}
#quiz,#final{display:none;}
#progresso{
margin-bottom:10px;
color:#ff4d4d;
font-weight:bold;
}
#exp {
margin-top:15px;
background:#1a1a1a;
padding:10px;
border-radius:8px;
border-left:4px solid red;
white-space: pre-line;
}

.tag-colou {
    color: red;
    font-size: 14px;
    font-weight: bold;
    background: #ffe6e6;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 10px;
}
#tela-punicao {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: black; color: red;
    z-index: 9999;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 20px;
}
#tela-punicao h1 { font-size: 30px; margin-bottom: 10px; }
#tela-punicao p { font-size: 18px; margin-bottom: 20px; color: white; }
</style>
</head>

<body>

<div id="tela-punicao">
    <h1>🚨 FRAUDE DETECTADA 🚨</h1>
    <p>Você saiu do simulado, mudou de janela ou tentou tirar print.<br>Essa ação foi registrada no sistema.</p>
    <button onclick="fecharPunicao()" style="max-width: 300px; background: white; color: black; font-weight: bold;">Estou ciente, voltar para a prova</button>
</div>

<div class="card">

<div id="inicio">
<h2>Simulado Matemática</h2>
<input id="nome" placeholder="Seu nome">
<button onclick="iniciar()">Iniciar Prova</button>
<button onclick="window.location.href='adm.html'" style="background:#333">Área ADM</button>
</div>

<div id="quiz">
<div id="progresso"></div>
<div id="p"></div>

<button onclick="prox()">Próxima</button>
<button id="btnVoltar" onclick="voltar()" style="background:#333">Voltar</button>
</div>

<div id="final">
<h2>Resultado Final</h2>
<p id="res"></p>
<h3>Ranking Geral</h3>
<div id="ranking"></div>
<button onclick="reiniciar()">Reiniciar Prova</button>
<button onclick="gerarPDF()" style="background:#333">Baixar PDF</button>
</div>

</div>

<script>

function registrarFraude() {
    if (!emProva) return; 
    colou = true; 
    document.getElementById("tela-punicao").style.display = "flex"; 
}

function fecharPunicao() {
    document.getElementById("tela-punicao").style.display = "none";
}

// DETECÇÃO 1: Mudar de aba ou minimizar navegador
document.addEventListener("visibilitychange", () => {
    if (document.hidden && emProva) {
        registrarFraude();
    }
});

// DETECÇÃO 2: Perder o foco da janela (Alt+Tab, abrir outro app, clicar fora no PC)
window.addEventListener("blur", () => {
    if (emProva) {
        registrarFraude();
    }
});

// DETECÇÃO 3: Tecla PrintScreen
window.addEventListener("keyup", (e) => {
    if (emProva && e.key === "PrintScreen") registrarFraude();
});

// DETECÇÃO 4: Atalhos de captura no Windows / Mac
window.addEventListener("keydown", (e) => {
    if (emProva && ((e.metaKey && e.shiftKey && e.key === "s") || 
        (e.metaKey && e.shiftKey && (e.key === "3" || e.key === "4" || e.key === "5")))) {
        registrarFraude();
    }
});

const banco = [
  {
    t: "Aula 1 - Observe a sequência: 3, 7, 11, 15, ... Qual é o próximo número e a regularidade dessa sequência?",
    o: ["19 (Soma-se 4)", "18 (Soma-se 3)", "20 (Multiplica-se por 2)", "16 (Soma-se 1)"],
    c: 0, 
    x: "Analisando a sequência, notamos que a diferença entre um termo e o anterior é sempre constante.\n\n7 - 3 = 4\n11 - 7 = 4\n\nPara achar o próximo termo, basta somar 4 ao último: 15 + 4 = 19.",

  },
  {

    t: "Aula 6 - A soma dos 5 primeiros números pares positivos (2, 4, 6, 8, 10) resulta em:",
    o: ["20", "30", "40", "50"],
    c: 1,
    x: "Podemos somar diretamente ou usar a fórmula da PA.\n\nSomando direto: 2 + 4 + 6 + 8 + 10 = 30.\n\nPela fórmula: S5 = (2 + 10) * 5 / 2 = 12 * 5 / 2 = 60 / 2 = 30.",

function iniciar(){
  nome = document.getElementById("nome").value.trim();
  if(!nome) {
    document.getElementById("nome").style.border = "2px solid red";
    return;
  }

  document.getElementById("inicio").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  emProva = true; 
  colou = false; 

  carregar();
}

function carregar(){
  if(i >= banco.length) return fim();

  let q = banco[i];
  respondido = false;

  document.getElementById("progresso").innerText = `Questão ${i+1} de ${banco.length}`;
  let containerPergunta = document.getElementById("p");
  containerPergunta.innerHTML = `<p><strong>Questão ${i+1}:</strong> ${q.t}</p>`;

  if(q.imagem){
    containerPergunta.innerHTML += `<img src="${q.imagem}" alt="Imagem da questão" style="display:block; max-width:100%; max-height:280px; margin:15px auto; border-radius:6px; border:1px solid #333;">`;
  }

  let html = "";
  q.o.forEach((o, idx) => {
    html += `<div class="opcao" data-idx="${idx}" onclick="responder(${idx})">${o}</div>`;
  });
  document.getElementById("op").innerHTML = html;
  
  let exp = document.getElementById("exp");
  exp.innerText = "";
  exp.style.color = "#fff";

  let respAnterior = respostas[i];
  if(respAnterior){
    respondido = true;
    let ops = document.querySelectorAll(".opcao");
    ops[respAnterior.c].classList.add("certa");
    if(respAnterior.r !== respAnterior.c){
      ops[respAnterior.r].classList.add("errada");
    }
    exp.innerText = respAnterior.x;
  }
}

function responder(e){
  if(respondido) return;
  respondido = true;

  let q = banco[i];
  let ops = document.querySelectorAll(".opcao");

  ops[q.c].classList.add("certa");
  if(e !== q.c) {
    ops[e].classList.add("errada");
  } else {
    pontos++;
  }

  respostas[i] = {q: q.t, r: e, c: q.c, x: q.x, o: q.o};
  let exp = document.getElementById("exp");
  exp.style.color = "#fff";
  exp.innerText = q.x;
}

function prox(){
  if(!respondido && i < banco.length) {
    let exp = document.getElementById("exp");
    exp.innerText = "⚠️ Por favor, escolha uma alternativa antes de avançar.";
    exp.style.color = "#ffcc00";
    return;
  }
  i++;
  carregar();
}

function voltar(){
  if(i <= 0) return;
  i--;
  carregar();
}

function fim(){
  emProva = false; 
  
  document.getElementById("quiz").style.display = "none";
  document.getElementById("final").style.display = "block";

  salvarRanking();
  mostrarRanking();

  document.getElementById("res").innerText = `${nome} acertou ${pontos}/${banco.length}`;
}

function salvarRanking(){
  db.ref("ranking").push({
    nome: nome,
    pontos: pontos,
    data: Date.now(),
    colou: colou 
  });
}

function mostrarRanking(){
  db.ref("ranking").off(); 
  db.ref("ranking").orderByChild("pontos").limitToLast(10).on("value", (snapshot) => {
    let dados = snapshot.val() || {};
    let lista = Object.values(dados);
    
    lista.sort((a,b) => b.pontos - a.pontos);

    document.getElementById("ranking").innerHTML =
      lista.map((x, idx) => {
          let tagCola = x.colou ? `<span class="tag-colou">🚨 Colou</span>` : '';
          return `${idx+1}º - ${x.nome} (${x.pontos} acertos) ${tagCola}`;
      }).join("<br><br>");
  });
}

function reiniciar(){
  i = 0;
  pontos = 0;
  respostas = [];
  respondido = false;
  
  colou = false; 
  emProva = false;

  document.getElementById("final").style.display = "none";
  document.getElementById("quiz").style.display = "none";
  document.getElementById("inicio").style.display = "block";
  document.getElementById("nome").value = "";
}

function gerarPDF(){
  const {jsPDF} = window.jspdf;
  let doc = new jsPDF();

  let y = 10;
  doc.text(`Aluno: ${nome}`, 10, y);
  y += 10;

  respostas.forEach((r, idx) => {
    let texto = `${idx+1}) ${r.q}\nSua Resposta: ${r.o[r.r]}\nResposta Correta: ${r.o[r.c]}\nExplicação: ${r.x}`;
    let linhas = doc.splitTextToSize(texto, 180);

    if(y + linhas.length * 7 > 280){
      doc.addPage();
      y = 10;
    }

    doc.text(linhas, 10, y);
    y += linhas.length * 7 + 5;
  });

  doc.save("resultado.pdf");
}

mostrarRanking();
</script>

</body>
</html>
